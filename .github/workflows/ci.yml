name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - run: bun install --frozen-lockfile
      - name: lockfile has no Databricks proxy host
        run: |
          if grep -q npm-proxy.cloud.databricks.com bun.lock; then
            echo "bun.lock must not record the Databricks npm proxy"
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run test
      - run: bun run fmt:check
